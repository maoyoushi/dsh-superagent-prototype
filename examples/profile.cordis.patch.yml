# Example profile configuration ($DSH_HOME/profiles/<profile>/cordis.patch.yml).
# Replace <placeholders> before first start; see docs/006-deployment.md.
# The repository, the plan file patterns and the subagents are set in the panel, not here.
- id: webserver
  config:
    host: 127.0.0.1
    port: 3082
- id: super-coding-agent
  config:
    stateDir: <absolute path, for example /home/me/.dsh/state/super-coding-agent>
